  <text x="931" y="571" class="cardB">Rule · Rarity · 상태전이 · Model 불확실성 · Real–Sim Gap 결합</text>
  <text x="931" y="599" class="cardB">후보화 → 전문가 확정 → Scenario 재생성 → 재학습</text>

