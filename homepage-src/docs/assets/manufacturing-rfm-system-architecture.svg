<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">한성대학교 고유 Physical AI Data Factory 아키텍처</title>
  <desc id="desc">외부기관의 표준 입력을 받아 한성대가 보유·개발하는 OmniLRS 파생 Deformation Engine, Manufacturing Ontology, 학생 Teleoperation Data Engine, Ontology 기반 Edge Case Intelligence를 Versioned Episode Factory와 HSU-PAC Shared Testbed 위에서 운영하고, 한성대 고유 산출물을 타 기관에 제공하며 실물 검증 결과를 다시 반영하는 폐루프 구조</desc>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfc"/>
      <stop offset="1" stop-color="#e8f3f4"/>
    </linearGradient>
    <linearGradient id="coreHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d4653"/>
      <stop offset="1" stop-color="#0f6b74"/>
    </linearGradient>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b2638" flood-opacity="0.10"/>
    </filter>
    <marker id="mTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f8f99"/>
    </marker>
    <marker id="mBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6fd0"/>
    </marker>
    <marker id="mPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a5fb8"/>
    </marker>
    <marker id="mOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ef8b1e"/>
    </marker>
    <style>
      text { font-family: "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; }
      .eyebrow  { font-size: 15px; font-weight: 800; fill: #0f8f99; letter-spacing: 1.6px; }
      .h1       { font-size: 40px; font-weight: 800; fill: #10303e; }
      .sub      { font-size: 19px; fill: #4d6b78; }
      .collabel { font-size: 14px; font-weight: 800; fill: #7d97a3; letter-spacing: 1.3px; }
      .panelT   { font-size: 21px; font-weight: 800; fill: #10303e; }
      .panelS   { font-size: 13.5px; fill: #6d8794; }
      .itemT    { font-size: 17px; font-weight: 800; fill: #10303e; }
      .itemB    { font-size: 13px; fill: #55707d; }
      .cardT    { font-size: 24px; font-weight: 800; fill: #10303e; }
      .cardB    { font-size: 15px; font-weight: 600; fill: #33566a; }
      .cardT2   { font-size: 21px; font-weight: 800; fill: #10303e; }
      .coreEye  { font-size: 15px; font-weight: 800; fill: #8fdfe4; letter-spacing: 1.4px; }
      .coreT    { font-size: 27px; font-weight: 800; fill: #ffffff; }
      .bandT    { font-size: 22px; font-weight: 800; fill: #ffffff; }
      .bandB    { font-size: 13.5px; fill: #a9dfe6; }
      .pill     { font-size: 13.5px; font-weight: 700; }
      .tbT      { font-size: 19px; font-weight: 800; fill: #0d5763; }
      .tbB      { font-size: 13.5px; font-weight: 600; fill: #3d6470; }
      .outT     { font-size: 16px; font-weight: 800; fill: #10303e; }
      .outB     { font-size: 12.5px; fill: #55707d; }
      .fb       { font-size: 15px; font-weight: 800; fill: #d97b13; }
      .footT    { font-size: 14px; fill: #7d97a3; }
      .footB    { font-size: 25px; font-weight: 800; fill: #0d4a7a; }
