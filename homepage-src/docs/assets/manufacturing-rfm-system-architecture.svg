  <path d="M608 452 L608 481" stroke="#2f6fd0" stroke-width="5" marker-end="url(#mBlue)"/>
  <path d="M1167 452 L1167 481" stroke="#0e8a86" stroke-width="5" marker-end="url(#mTeal)"/>
