  <text x="985" y="241" text-anchor="middle" font-size="12.5" fill="#c2eef1">OmniLRS · HILS</text>
  <rect x="1084" y="199" width="170" height="54" rx="12" fill="#ffffff" opacity="0.14"/>
  <text x="1169" y="221" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">HUMAN DATA</text>
  <text x="1169" y="241" text-anchor="middle" font-size="12.5" fill="#c2eef1">30명 · 5개 조</text>
