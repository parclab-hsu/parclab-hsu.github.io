  <rect x="903" y="485" width="529" height="140" rx="16" fill="#fdf0dd"/>
  <rect x="903" y="485" width="8" height="140" rx="4" fill="#ef8b1e"/>
  <circle cx="951" cy="523" r="22" fill="#ef8b1e"/>
