<svg xmlns="http://www.w3.org/2000/svg" width="500" height="240" viewBox="0 0 500 240" font-family="sans-serif"><rect width="500" height="240" fill="#fff"/><text x="250" y="18" font-size="13" text-anchor="middle" fill="#333">그라운드 접지 방식 3가지</text>
<!-- Panel 1: series single-point -->
<text x="85" y="42" font-size="12" text-anchor="middle" fill="#1c7ed6">① 직렬 단일점</text>
<g font-size="11" text-anchor="middle" stroke="#333">
<rect x="60" y="55" width="50" height="22" fill="#e7f5ff"/><text x="85" y="70" stroke="none" fill="#333">A</text>
<rect x="60" y="92" width="50" height="22" fill="#e7f5ff"/><text x="85" y="107" stroke="none" fill="#333">B</text>
<rect x="60" y="129" width="50" height="22" fill="#e7f5ff"/><text x="85" y="144" stroke="none" fill="#333">C</text>
</g>
<g stroke="#333" fill="none"><line x1="85" y1="77" x2="85" y2="92"/><line x1="85" y1="114" x2="85" y2="129"/><line x1="85" y1="151" x2="85" y2="178"/></g>
<line x1="70" y1="178" x2="100" y2="178" stroke="#333" stroke-width="2"/><line x1="75" y1="183" x2="95" y2="183" stroke="#333"/><line x1="80" y1="188" x2="90" y2="188" stroke="#333"/>
<text x="85" y="212" font-size="9" text-anchor="middle" fill="#e03131">노이즈 전체 영향</text>
<!-- Panel 2: parallel single-point (star) -->
<text x="250" y="42" font-size="12" text-anchor="middle" fill="#1c7ed6">② 병렬 단일점(스타)</text>
<g font-size="11" text-anchor="middle" stroke="#333">
<rect x="200" y="55" width="50" height="22" fill="#e7f5ff"/><text x="225" y="70" stroke="none" fill="#333">A</text>
<rect x="200" y="92" width="50" height="22" fill="#e7f5ff"/><text x="225" y="107" stroke="none" fill="#333">B</text>
<rect x="200" y="129" width="50" height="22" fill="#e7f5ff"/><text x="225" y="144" stroke="none" fill="#333">C</text>
</g>
<g stroke="#333" fill="none"><line x1="250" y1="66" x2="290" y2="66"/><line x1="250" y1="103" x2="290" y2="103"/><line x1="250" y1="140" x2="290" y2="140"/><line x1="290" y1="66" x2="290" y2="178"/></g>
<line x1="275" y1="178" x2="305" y2="178" stroke="#333" stroke-width="2"/><line x1="280" y1="183" x2="300" y2="183" stroke="#333"/><line x1="285" y1="188" x2="295" y2="188" stroke="#333"/>
<text x="255" y="212" font-size="9" text-anchor="middle" fill="#e8590c">배선 길어짐</text>
<!-- Panel 3: multi-point parallel -->
<text x="415" y="42" font-size="12" text-anchor="middle" fill="#1c7ed6">③ 다중점 병렬</text>
<g font-size="11" text-anchor="middle" stroke="#333">
<rect x="365" y="55" width="50" height="22" fill="#e7f5ff"/><text x="390" y="70" stroke="none" fill="#333">A</text>
<rect x="365" y="92" width="50" height="22" fill="#e7f5ff"/><text x="390" y="107" stroke="none" fill="#333">B</text>
<rect x="365" y="129" width="50" height="22" fill="#e7f5ff"/><text x="390" y="144" stroke="none" fill="#333">C</text>
</g>
<rect x="350" y="165" width="130" height="14" fill="#adb5bd" stroke="#495057"/><text x="415" y="176" font-size="9" text-anchor="middle" fill="#212529">GND plane</text>
<g stroke="#333" fill="none"><line x1="375" y1="77" x2="375" y2="165"/><line x1="390" y1="114" x2="390" y2="165"/><line x1="405" y1="151" x2="405" y2="165"/></g>
<text x="415" y="205" font-size="9" text-anchor="middle" fill="#2f9e44">루프↓ · PCB 사용</text></svg>
