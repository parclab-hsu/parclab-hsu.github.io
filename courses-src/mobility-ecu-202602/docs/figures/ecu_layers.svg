<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">모빌리티 ECU 계층 구조</title>
<desc id="desc">센서와 명령 입력이 MCU 펌웨어를 거쳐 전원, 게이트드라이버, 인버터와 모터로 전달되고 전류와 속도 피드백이 돌아오는 구조</desc>
<style>
  text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#172033} .h{font-size:24px;font-weight:700}.m{font-size:18px;font-weight:700}.s{font-size:14px}.box{fill:#f7f9fc;stroke:#355070;stroke-width:2}.soft{fill:#eaf4ff;stroke:#3772ff;stroke-width:2}.power{fill:#fff4e6;stroke:#d97706;stroke-width:2}.sense{fill:#ebf8ef;stroke:#2f855a;stroke-width:2}.warn{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.arrow{stroke:#2d3748;stroke-width:3;fill:none;marker-end:url(#a)}.feed{stroke:#64748b;stroke-width:3;stroke-dasharray:8 7;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2d3748"/></marker></defs>
<rect width="960" height="520" fill="#ffffff"/>
<text x="36" y="46" class="h">모빌리티 ECU는 입력, 판단, 구동, 피드백의 폐루프 시스템</text>
<rect x="40" y="90" width="190" height="130" rx="10" class="sense"/><text x="72" y="128" class="m">입력 계층</text><text x="72" y="160" class="s">엔코더, 홀센서</text><text x="72" y="184" class="s">전류 션트, 전압 ADC</text><text x="72" y="208" class="s">원격 명령, IMU</text>
<rect x="300" y="82" width="260" height="150" rx="10" class="soft"/><text x="330" y="120" class="m">MCU/펌웨어 계층</text><text x="330" y="152" class="s">STM32 GPIO, EXTI, ADC</text><text x="330" y="176" class="s">Timer PWM, UART/Teleplot</text><text x="330" y="200" class="s">PI 제어, Fault 관리</text>
<rect x="635" y="90" width="250" height="130" rx="10" class="power"/><text x="666" y="128" class="m">전력 구동 계층</text><text x="666" y="160" class="s">게이트드라이버</text><text x="666" y="184" class="s">H-브리지/3상 인버터</text><text x="666" y="208" class="s">DC/BLDC 휠 모터</text>
<rect x="300" y="315" width="260" height="110" rx="10" class="warn"/><text x="330" y="352" class="m">안전·검증 계층</text><text x="330" y="384" class="s">요구사항, HSI, 테스트</text><text x="330" y="408" class="s">전류 제한, 과열/저전압 보호</text>
<path d="M230 155 H300" class="arrow"/><path d="M560 155 H635" class="arrow"/><path d="M760 220 C760 300 560 300 520 315" class="feed"/><path d="M395 315 C350 285 250 265 135 220" class="feed"/><path d="M430 232 V315" class="arrow"/>
<text x="246" y="142" class="s">센싱값</text><text x="574" y="142" class="s">PWM/Enable</text><text x="586" y="292" class="s">속도·전류 피드백</text><text x="450" y="285" class="s">시험 기준</text>
</svg>