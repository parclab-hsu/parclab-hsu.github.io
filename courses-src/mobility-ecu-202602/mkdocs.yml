site_name: 모빌리티 전자제어유닛 실습 · 2026-2학기
site_description: 한성대학교 미래모빌리티학과 3학년 · BLDC 구동 전기전자제어유닛 (전자부품→회로→PCB→STM32 펌웨어) + AMR 캡스톤
site_url: https://parclab-hsu.github.io/courses/202602/mobility-ecu/
site_dir: ../../.local-site/mobility-ecu
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  language: ko
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 다크 모드로
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - content.code.copy
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.blocks.caption
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 강의 개요: index.md
  - 🧭 강의 전체 흐름: 00-course-flow.md
  - 🤖 AX 교육과정 개편: ax-curriculum.md
  - 커리큘럼(15주차): curriculum.md
  - 첨부자료 활용 가이드: resources.md
  - 용어·도해 사전: glossary.md
  - 최신 기술 트렌드: trends.md
  - 주차별 강의 자료:
      - 1주차 · 오리엔테이션·AMR 제어유닛 구조: week01.md
      - 2주차 · 전자부품 1 · 저항·커패시터·인덕터: week02.md
      - 3주차 · 전자부품 2 · 다이오드·BJT·MOSFET: week03.md
      - 4주차 · 전원회로: week04.md
      - 5주차 · DC/BLDC 모터 원리: week05.md
      - 6주차 · 인버터·PWM 구동: week06.md
      - 7주차 · 제어공학·PI 속도제어: week07.md
      - 8주차 · STM32 GPIO·메모리맵·레지스터: week08.md
      - 9주차 · 입력·클럭·인터럽트: week09.md
      - 10주차 · ADC·Timer·UART: week10.md
      - 11주차 · 요구사항·HSI·시스템 블록도: week11.md
      - 12주차 · 인버터 하드웨어 설계: week12.md
      - 13주차 · 회로도·PCB 설계 기초: week13.md
      - 14주차 · PCB 노이즈·그라운드: week14.md
      - 15주차 · 구동 펌웨어 통합·최종 발표: week15.md
  - 강의 노트:
      - 2~4주차 · 전자부품·전원회로: 01-components-power.md
      - 5·6·7·12주차 · 모터·인버터·제어: 02-motor-inverter-control.md
      - 8~10주차 · STM32 펌웨어: 03-stm32-firmware.md
      - 11·13·14·15주차 · PCB·펌웨어 통합: 04-pcb-firmware-integration.md
  - 실습 코드:
      - 교육용 코드 흐름: code/README.md
  - 캡스톤 프로젝트:
      - AMR 개발 프로젝트: ugv-project.md
      - AMR 부품표·회로: ugv-bom.md
