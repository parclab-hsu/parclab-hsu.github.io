  <text x="360" y="444" text-anchor="middle" font-size="12" fill="#14532d">우주 로버 대회 · 월면 험지주행 미션</text>

  <!-- center -->
  <text x="360" y="270" text-anchor="middle" font-size="17" font-weight="800" fill="#111">본 강의</text>
  <text x="360" y="290" text-anchor="middle" font-size="12" fill="#333">모빌리티 전자제어유닛</text>
