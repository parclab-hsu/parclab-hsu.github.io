<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">강의 구성요소 × 국내외 프로그램 커버리지</text>

  <!-- 본 강의 강조 열 -->
  <rect x="645" y="42" width="95" height="348" fill="#fef9c3" fill-opacity="0.8"/>

  <!-- 헤더 구분선 -->
  <line x1="20" y1="90" x2="740" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- 행 구분선 -->
  <line x1="20" y1="138" x2="740" y2="138" stroke="#e5e7eb"/>
  <line x1="20" y1="180" x2="740" y2="180" stroke="#e5e7eb"/>
  <line x1="20" y1="222" x2="740" y2="222" stroke="#e5e7eb"/>
  <line x1="20" y1="264" x2="740" y2="264" stroke="#e5e7eb"/>
  <line x1="20" y1="306" x2="740" y2="306" stroke="#e5e7eb"/>
  <line x1="20" y1="348" x2="740" y2="348" stroke="#e5e7eb"/>
  <!-- 열 구분선 -->
  <line x1="170" y1="42" x2="170" y2="390" stroke="#cbd5e1"/>
  <line x1="645" y1="42" x2="645" y2="390" stroke="#eab308" stroke-width="1.5"/>

  <!-- 열 헤더 -->
  <g text-anchor="middle" font-size="12" fill="#334155">
    <text x="217.5" y="63" font-weight="600">Stanford</text><text x="217.5" y="79" font-size="11" fill="#64748b">ME210</text>
    <text x="312.5" y="63" font-weight="600">MIT</text><text x="312.5" y="79" font-size="11" fill="#64748b">6.115</text>
    <text x="407.5" y="63" font-weight="600">CMU</text><text x="407.5" y="79" font-size="11" fill="#64748b">349·578</text>
    <text x="502.5" y="63" font-weight="600">中 NXP컵</text><text x="502.5" y="79" font-size="11" fill="#64748b">지능차</text>
    <text x="597.5" y="63" font-weight="600">NASA</text><text x="597.5" y="79" font-size="11" fill="#64748b">Lunabotics</text>
    <text x="692.5" y="63" font-weight="800" fill="#a16207">본 강의</text><text x="692.5" y="79" font-size="11" fill="#a16207">ECU</text>
  </g>

  <!-- 행 레이블 -->
  <g font-size="12.5" fill="#1f2937">
    <text x="28" y="121">아날로그 회로·전원</text>
    <text x="28" y="163">모터·인버터 구동</text>
    <text x="28" y="205">레지스터급 펌웨어</text>
    <text x="28" y="247">PCB 설계</text>
    <text x="28" y="289">시스템 통합</text>
    <text x="28" y="331">팀 프로젝트</text>
    <text x="28" y="373">대회 미션</text>
  </g>

  <!-- 셀 마크: ● 핵심(초록) / ○ 부분·연계(주황) / – 해당없음 -->
  <g>
    <!-- R0 아날로그 회로·전원 -->
    <circle cx="217.5" cy="117" r="9" fill="#16a34a"/>
    <circle cx="312.5" cy="117" r="8.5" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="407.5" cy="117" r="8.5" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="502.5" cy="117" r="9" fill="#16a34a"/>
    <circle cx="597.5" cy="117" r="8.5" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="692.5" cy="117" r="9" fill="#16a34a"/>
    <!-- R1 모터·인버터 구동 -->
    <circle cx="217.5" cy="159" r="9" fill="#16a34a"/>
    <circle cx="312.5" cy="159" r="8.5" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="407.5" cy="159" r="9" fill="#16a34a"/>
    <circle cx="502.5" cy="159" r="9" fill="#16a34a"/>
    <circle cx="597.5" cy="159" r="9" fill="#16a34a"/>
    <circle cx="692.5" cy="159" r="9" fill="#16a34a"/>
    <!-- R2 레지스터급 펌웨어 -->
    <circle cx="217.5" cy="201" r="8.5" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="312.5" cy="201" r="9" fill="#16a34a"/>
    <circle cx="407.5" cy="201" r="9" fill="#16a34a"/>
    <circle cx="502.5" cy="201" r="9" fill="#16a34a"/>
    <circle cx="597.5" cy="201" r="8.5" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="692.5" cy="201" r="9" fill="#16a34a"/>
    <!-- R3 PCB 설계 -->
    <circle cx="217.5" cy="243" r="8.5" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="312.5" cy="243" r="8.5" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="407.5" cy="243" r="8.5" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="502.5" cy="243" r="9" fill="#16a34a"/>
    <circle cx="597.5" cy="243" r="9" fill="#16a34a"/>
    <circle cx="692.5" cy="243" r="9" fill="#16a34a"/>
    <!-- R4 시스템 통합 -->
    <circle cx="217.5" cy="285" r="9" fill="#16a34a"/>
    <circle cx="312.5" cy="285" r="9" fill="#16a34a"/>
    <circle cx="407.5" cy="285" r="9" fill="#16a34a"/>
    <circle cx="502.5" cy="285" r="9" fill="#16a34a"/>
    <circle cx="597.5" cy="285" r="9" fill="#16a34a"/>
    <circle cx="692.5" cy="285" r="9" fill="#16a34a"/>
    <!-- R5 팀 프로젝트 -->
    <circle cx="217.5" cy="327" r="9" fill="#16a34a"/>
    <circle cx="312.5" cy="327" r="8.5" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="407.5" cy="327" r="9" fill="#16a34a"/>
    <circle cx="502.5" cy="327" r="9" fill="#16a34a"/>
    <circle cx="597.5" cy="327" r="9" fill="#16a34a"/>
    <circle cx="692.5" cy="327" r="9" fill="#16a34a"/>
    <!-- R6 대회 미션 -->
    <text x="217.5" y="374" text-anchor="middle" font-size="14" fill="#cbd5e1">–</text>
    <text x="312.5" y="374" text-anchor="middle" font-size="14" fill="#cbd5e1">–</text>
    <circle cx="407.5" cy="369" r="8.5" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="502.5" cy="369" r="9" fill="#16a34a"/>
    <circle cx="597.5" cy="369" r="9" fill="#16a34a"/>
    <circle cx="692.5" cy="369" r="9" fill="#16a34a"/>
  </g>

  <!-- 범례 -->
  <g font-size="12" fill="#475569">
    <circle cx="200" cy="410" r="8" fill="#16a34a"/><text x="214" y="414">핵심으로 다룸</text>
    <circle cx="330" cy="410" r="7.5" fill="none" stroke="#f59e0b" stroke-width="2.5"/><text x="344" y="414">부분·연계</text>
    <text x="440" y="414" font-size="14" fill="#cbd5e1">–</text><text x="454" y="414">해당 없음</text>
    <text x="600" y="414" font-size="11.5" fill="#a16207">노란 열 = 본 강의(전 영역 포괄)</text>
  </g>
</svg>
