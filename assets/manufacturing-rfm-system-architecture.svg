<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="960" viewBox="0 0 1800 960" role="img" aria-labelledby="title desc">
  <title id="title">한성대학교 제조 Physical AI Data Factory 아키텍처</title>
  <desc id="desc">과제 컨소시엄의 표준 입력을 받아 한성대학교 Physical AI Data Factory Core 에서 ① Manufacturing Deformation Engine, ② Human Data Engine, ③ Manufacturing Ontology 와 Ontology-based Edge Case Intelligence 를 운영하고, Versioned Physical AI Episode Factory 와 HSU Physical AI Shared Testbed 위에서 한성대 핵심 산출물을 만들어 타 기관에 제공하며 실물 검증 결과를 다시 반영하는 구조</desc>

  <defs>
    <marker id="dn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 0 L5 10 z" fill="#8FA3AF"/>
    </marker>
    <marker id="rt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8FA3AF"/>
    </marker>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M5 0 L10 10 L0 10 z" fill="#0295D5"/>
    </marker>
    <style>
      text { font-family: "Noto Sans KR", "Noto Sans CJK KR", "Malgun Gothic", Arial, sans-serif; }
      .eyebrow { font-size: 16px; font-weight: 700; fill: #0295D5; letter-spacing: 1.4px; }
      .h1      { font-size: 38px; font-weight: 800; fill: #1A1A1A; }
      .ci      { font-size: 19px; font-weight: 800; fill: #0295D5; letter-spacing: .5px; }
      .cis     { font-size: 11px; font-weight: 700; fill: #7A8A93; letter-spacing: 1.6px; }
      .colhd   { font-size: 20px; font-weight: 800; }
      .itemT   { font-size: 19px; font-weight: 700; fill: #2B2B2B; }
      .itemB   { font-size: 15px; fill: #6B7B84; }
      .cardN   { font-size: 20px; font-weight: 800; }
      .cardT   { font-size: 21px; font-weight: 800; }
      .cardB   { font-size: 15.5px; fill: #4A5A63; }
      .tag     { font-size: 13.5px; font-weight: 700; fill: #22A06B; }
      .badge   { font-size: 13.5px; font-weight: 700; fill: #0295D5; }
      .bandT   { font-size: 21px; font-weight: 800; fill: #1A1A1A; }
      .bandB   { font-size: 15px; fill: #6B7B84; }
      .pill    { font-size: 14.5px; font-weight: 600; fill: #3A4A53; }
      .outT    { font-size: 17.5px; font-weight: 800; fill: #1A1A1A; }
      .outB    { font-size: 14px; fill: #6B7B84; }
      .fb      { font-size: 15px; font-weight: 600; fill: #3A4A53; }
      .foot    { font-size: 23px; font-weight: 800; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1800" height="960" fill="#ffffff"/>
  <g transform="translate(0,-110)">

  <!-- ══ 좌: 과제 컨소시엄 ══ -->
  <rect x="44" y="150" width="300" height="52" fill="#ffffff" stroke="#0295D5" stroke-width="2"/>
  <text x="194" y="184" text-anchor="middle" class="colhd" fill="#1A1A1A">과제 컨소시엄</text>

  <text x="66" y="248" class="itemT">모빌테크</text>
  <text x="66" y="278" class="itemB">3D Asset · 좌표 · LOD</text>
  <text x="66" y="302" class="itemB">Semantic · 현장 Meta</text>
  <path d="M60 330 H328" stroke="#DDE4E8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="66" y="378" class="itemT">Robot · 제조기업</text>
  <text x="66" y="408" class="itemB">Real Robot Episode</text>
  <text x="66" y="432" class="itemB">Sensor · Failure · 품질</text>
  <path d="M60 460 H328" stroke="#DDE4E8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="66" y="508" class="itemT">RFM 기관</text>
  <text x="66" y="538" class="itemB">Model · Checkpoint</text>
  <text x="66" y="562" class="itemB">Confidence · Hard Case</text>
  <path d="M60 590 H328" stroke="#DDE4E8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="66" y="638" class="itemT">NVIDIA Cosmos</text>
  <text x="66" y="668" class="itemB">World Foundation Model</text>
  <text x="66" y="692" class="itemB">외관 · 환경 다양화</text>

  <rect x="44" y="740" width="300" height="66" fill="#F2F5F7"/>
  <text x="194" y="768" text-anchor="middle" class="itemB">참여기관별 자원을 공통</text>
  <text x="194" y="792" text-anchor="middle" class="itemB">Interface 로 연계</text>

  <!-- 좌 → 코어 -->
  <path d="M352 442 L372 470 L352 498" fill="none" stroke="#B7C4CC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ══ 중앙: Core ══ -->
  <rect x="380" y="150" width="1090" height="52" fill="#0295D5"/>
  <text x="925" y="184" text-anchor="middle" class="colhd" fill="#ffffff">한성대학교 Physical AI Data Factory Core</text>

  <!-- ① 대표성과 -->
  <rect x="380" y="218" width="533" height="152" fill="#F5FAFD" stroke="#0295D5" stroke-width="2.5"/>
  <text x="404" y="248" class="tag">OmniLRS-derived</text>
  <rect x="795" y="228" width="98" height="28" rx="4" fill="#DAEFF8"/>
  <text x="844" y="248" text-anchor="middle" class="badge">대표 성과</text>
  <text x="404" y="282" class="cardN" fill="#0295D5">①</text>
  <text x="432" y="282" class="cardT" fill="#0295D5">Manufacturing Deformation Engine</text>
  <text x="404" y="316" class="cardB">달 지형 변형기술을 제조환경 Contact–Material–State 모델로 고도화</text>
  <text x="404" y="344" class="cardB">마찰 · 강성 · 접촉 · 변형 · 복원 · 마모 · 반복하중 · Calibration</text>

  <!-- ② Human Data Engine -->
  <rect x="937" y="218" width="533" height="152" fill="#FBFCFD" stroke="#D8DEE3" stroke-width="1.5"/>
  <text x="961" y="262" class="cardN" fill="#2B2B2B">②</text>
  <text x="989" y="262" class="cardT" fill="#2B2B2B">Human Data Engine (학생 참여)</text>
  <text x="961" y="300" class="cardB">Teleoperation 기반 Demonstration · Recovery · Edge Case 데이터 생성</text>
  <text x="961" y="328" class="cardB">및 품질 검수 — MD 교육 → 이수자 선발 → 유급 연구참여</text>

  <path d="M646 372 V396" stroke="#A9B8C1" stroke-width="2.5" marker-end="url(#dn)"/>
  <path d="M1203 372 V396" stroke="#A9B8C1" stroke-width="2.5" marker-end="url(#dn)"/>

  <!-- ③ Manufacturing Ontology -->
  <rect x="380" y="400" width="533" height="140" fill="#FBFCFD" stroke="#D8DEE3" stroke-width="1.5"/>
  <text x="404" y="442" class="cardN" fill="#2B2B2B">③</text>
  <text x="432" y="442" class="cardT" fill="#2B2B2B">Manufacturing Ontology</text>
  <text x="404" y="480" class="cardB">Asset–Process–Task–State–Event–Failure–Recovery 간 의미관계를</text>
  <text x="404" y="508" class="cardB">구조화하고, Cosmos 생성 조건 및 Semantic 정보와 연계</text>

  <!-- ③ Edge Case Intelligence (③ 의 두 번째 기능) -->
  <rect x="937" y="400" width="533" height="140" fill="#F5FAFD" stroke="#0295D5" stroke-width="2.5"/>
  <text x="961" y="442" class="cardN" fill="#0295D5">③</text>
  <text x="989" y="442" class="cardT" fill="#0295D5">Edge Case Intelligence</text>
  <text x="961" y="480" class="cardB">Rule · Rarity · State Transition · Uncertainty · Real–Sim Gap</text>
  <text x="961" y="508" class="cardB">기반 Edge Case 탐색 → Scenario 재생성 → 재학습</text>

  <path d="M915 470 L933 470" stroke="#A9B8C1" stroke-width="2.5" marker-end="url(#rt)"/>
  <path d="M646 542 V566" stroke="#A9B8C1" stroke-width="2.5" marker-end="url(#dn)"/>
  <path d="M1203 542 V566" stroke="#A9B8C1" stroke-width="2.5" marker-end="url(#dn)"/>

  <!-- Episode Factory -->
  <rect x="380" y="570" width="1090" height="168" fill="#F5FAFD"/>
  <text x="404" y="608" class="bandT">Versioned Physical AI Episode Factory</text>
  <text x="404" y="638" class="bandB">LeRobotDataset v3 기반 정규화 · 시간동기 · QC · Provenance · Version 관리</text>
  <g class="pill">
    <rect x="404" y="660" width="128" height="46" fill="#ffffff" stroke="#D8DEE3"/><text x="468" y="689" text-anchor="middle">Synthetic</text>
    <rect x="544" y="660" width="92"  height="46" fill="#ffffff" stroke="#D8DEE3"/><text x="590" y="689" text-anchor="middle">Real</text>
    <rect x="648" y="660" width="158" height="46" fill="#ffffff" stroke="#D8DEE3"/><text x="727" y="689" text-anchor="middle">Teleoperation</text>
    <rect x="818" y="660" width="164" height="46" fill="#ffffff" stroke="#D8DEE3"/><text x="900" y="689" text-anchor="middle">Edge · Recovery</text>
    <rect x="994" y="660" width="176" height="46" fill="#ffffff" stroke="#D8DEE3"/><text x="1082" y="689" text-anchor="middle">RFM Benchmark</text>
    <rect x="1182" y="660" width="140" height="46" fill="#ffffff" stroke="#D8DEE3"/><text x="1252" y="689" text-anchor="middle">Sim-to-Real</text>
    <rect x="1334" y="660" width="112" height="46" fill="#ffffff" stroke="#D8DEE3"/><text x="1390" y="689" text-anchor="middle">Feedback</text>
  </g>

  <!-- Shared Testbed -->
  <rect x="380" y="758" width="1090" height="110" fill="#F5FAFD"/>
  <text x="404" y="794" class="bandT">HSU Physical AI Shared Testbed</text>
  <text x="404" y="822" class="bandB">GPU 서버 · DGX Spark · AWS Burst · NAS · 10GbE  |  보유 / 착수 시 구축 / 선택 증설</text>
  <text x="404" y="848" class="bandB">Isaac Sim/Lab · ROS 2 · Mobile Arena · Manipulation Cell · Sensor Studio · Teleop Console · 기업별 격리</text>

  <!-- 코어 → 우 -->
  <path d="M1478 442 L1498 470 L1478 498" fill="none" stroke="#B7C4CC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ══ 우: 핵심 산출물 ══ -->
  <rect x="1500" y="150" width="256" height="52" fill="#199ED8"/>
  <text x="1628" y="184" text-anchor="middle" class="colhd" fill="#ffffff">한성대 핵심 산출물</text>
  <text x="1628" y="228" text-anchor="middle" class="outB">타 기관이 바로 활용하는 패키지</text>

  <text x="1518" y="278" class="outT">Dynamic Physics Twin</text>
  <text x="1518" y="306" class="outB">Deformation-aware</text>
  <text x="1518" y="328" class="outB">Asset · Material · State</text>
  <path d="M1512 356 H1744" stroke="#DDE4E8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="1518" y="404" class="outT">Edge Case Package</text>
  <text x="1518" y="432" class="outB">Ontology Index · Trigger</text>
  <text x="1518" y="454" class="outB">Failure · Recovery Scenario</text>
  <path d="M1512 482 H1744" stroke="#DDE4E8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="1518" y="530" class="outT">RFM Dataset &amp; Benchmark</text>
  <text x="1518" y="558" class="outB">Synthetic · Real · Teleoperation</text>
  <text x="1518" y="580" class="outB">Sim-to-Real Evaluation</text>
  <path d="M1512 608 H1744" stroke="#DDE4E8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="1518" y="656" class="outT">Shared Validation Package</text>
  <text x="1518" y="684" class="outB">참여기업 사전통합 · 전문인력</text>
  <text x="1518" y="706" class="outB">공동 검증체계</text>

  <!-- 피드백 -->
  <path d="M1628 730 V932 H560" fill="none" stroke="#0295D5" stroke-width="2.5" stroke-dasharray="9 7"/>
  <path d="M560 932 V884" stroke="#0295D5" stroke-width="2.5" marker-end="url(#up)"/>
  <text x="584" y="918" class="fb">Physical Validation → Failure · Model Uncertainty · Domain Gap → Edge Case · Physics 재반영</text>

  <!-- 하단 밴드 -->
  <rect x="44" y="958" width="1712" height="106" fill="#0295D5"/>
  <text x="900" y="1000" text-anchor="middle" class="foot">Manufacturing Deformation Engine 을 중심으로 Physics Twin – Edge Intelligence – Human Data –</text>
  <text x="900" y="1038" text-anchor="middle" class="foot">RFM – Physical Validation 을 연결하는 End-to-End Physical AI Data Factory</text>
  </g>
</svg>
